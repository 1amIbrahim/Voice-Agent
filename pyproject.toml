[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-gateway"
version = "0.1.0"
description = "Local-first voice gateway"
requires-python = ">=3.10"

[project.optional-dependencies]
audio = ["sounddevice>=0.4", "numpy>=1.24"]
asr = ["openai-whisper>=20240930"]
vad = ["silero-vad>=5.1"]
cuda = ["torch==2.11.0+cu130", "torchaudio==2.11.0+cu130"]
understanding = ["google-genai>=2.19", "ollama>=0.4", "pydantic>=2.0"]
protocol = ["pydantic>=2.0"]
tts = ["piper-tts>=1.7"]
test = ["pytest>=8", "pydantic>=2.0", "pytest-asyncio>=0.24"]

[project.scripts]
voice-gateway = "voice_gateway.main:main"

[tool.setuptools.packages.find]
include = ["voice_gateway*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
