[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-gateway"
version = "0.1.0"
description = "Local-first voice gateway"
requires-python = ">=3.9"

[project.optional-dependencies]
audio = ["sounddevice>=0.4", "numpy>=1.24"]
asr = ["faster-whisper>=1.1"]
vad = ["silero-vad>=5.1", "torch>=2.0"]
understanding = ["ollama>=0.4", "pydantic>=2.0"]
protocol = ["pydantic>=2.0"]
tts = []
test = ["pytest>=8", "pydantic>=2.0", "pytest-asyncio>=0.24"]

[project.scripts]
voice-gateway = "voice_gateway.main:main"

[tool.setuptools.packages.find]
include = ["voice_gateway*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
